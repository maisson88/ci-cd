name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code
      - uses: actions/checkout@v4

      # STEP 2: Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # STEP 3: Install dependencies
      - run: npm install

      # STEP 4: Run tests
      - run: npm test
